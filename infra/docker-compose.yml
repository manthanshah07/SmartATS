version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartats_postgres
    environment:
      POSTGRES_DB: smartats_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartats_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: 
      context: ../backend
    container_name: smartats_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/smartats_db
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build: 
      context: ../backend
    container_name: smartats_celery
    command: celery -A smartats worker -l info
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/smartats_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data: